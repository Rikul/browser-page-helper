<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Helper</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="page">
      <div class="page-title" id="page-title">No page</div>
      <div class="page-host" id="page-host"></div>
    </div>
    <button id="clear-btn" class="icon" title="Clear chat" aria-label="Clear chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button id="settings-btn" class="icon" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <form id="settings" hidden>
    <div class="settings-head">
      <h2>Connection</h2>
      <p>Works with any OpenAI-compatible API.</p>
    </div>
    <label>Base URL
      <input id="base-url" type="url" placeholder="https://openrouter.ai/api/v1" required>
    </label>
    <label>API key
      <input id="api-key" type="password" placeholder="sk-..." autocomplete="off">
    </label>
    <label>Model
      <input id="model" type="text" placeholder="deepseek/deepseek-v4.1-flash" required>
    </label>
    <div class="row">
      <button type="submit" class="primary">Save settings</button>
      <button type="button" id="settings-cancel" class="ghost">Close</button>
      <span id="settings-status" role="status"></span>
    </div>
  </form>

  <main id="messages" aria-live="polite"></main>

  <template id="empty-tpl">
    <div class="empty">
      <h1>What would you like to know about this page?</h1>
      <div class="suggestions">
        <button type="button" class="suggestion"><span>Summarize this page</span></button>
        <button type="button" class="suggestion"><span>List the key points</span></button>
        <button type="button" class="suggestion"><span>Explain it in plain language</span></button>
      </div>
    </div>
  </template>

  <footer>
    <div class="options" role="group" aria-label="What to send and how to show replies">
      <label class="chip" title="Send a screenshot of the visible tab (needs a vision model)">
        <input id="include-shot" type="checkbox" checked> Send Screenshot
      </label>
      <label class="chip" title="Show replies with formatting. Turn off to see the raw text.">
        <input id="markdown" type="checkbox" checked> Render Markdown
      </label>
    </div>
    <div class="compose">
      <textarea id="input" rows="1" placeholder="Ask about this page" aria-label="Message" title="Enter sends. Shift+Enter adds a line."></textarea>
      <button id="send-btn" class="send" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
      <button id="stop-btn" class="send stop" title="Stop" aria-label="Stop" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
      </button>
    </div>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
